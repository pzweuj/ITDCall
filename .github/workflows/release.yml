name: Release

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  detect:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.versions.outputs.releases }}
    steps:
      - name: Find version commits
        id: versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event:
              commits = json.load(event)['commits']

          releases = {}
          for commit in commits:
              subject, _, _ = commit['message'].partition('\n')
              version = subject.removesuffix('\r')
              if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
                  continue
              sha = commit['id']
              if version in releases and releases[version] != sha:
                  raise SystemExit(f'Multiple commits in this push use version {version}')
              releases[version] = sha

          entries = [{'version': version, 'sha': sha} for version, sha in releases.items()]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('releases=' + json.dumps(entries), file=output)
          PY

  release:
    needs: detect
    if: ${{ needs.detect.outputs.releases != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.releases) }}
    concurrency:
      group: release-${{ matrix.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ matrix.version }}
      RELEASE_SHA: ${{ matrix.sha }}
      RUST_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test and build
        run: |
          rustup target add "$RUST_TARGET"
          cargo test --locked --all-targets
          cargo build --release --locked --target "$RUST_TARGET"
          "target/$RUST_TARGET/release/itdcall" --version
      - name: Package Linux executable and license
        run: |
          mkdir -p dist
          tar -czf "dist/itdcall-$VERSION-linux-x86_64-musl.tar.gz" \
            -C "target/$RUST_TARGET/release" itdcall -C "$GITHUB_WORKSPACE" LICENSE
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit=$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}" || true)
          if [[ -n "$tag_commit" && "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo "Tag $VERSION already points to $tag_commit" >&2
            exit 1
          fi
          if [[ "$tag_commit" == "$RELEASE_SHA" ]] && gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists for $RELEASE_SHA"
            exit 0
          fi
          gh release create "$VERSION" "dist/itdcall-$VERSION-linux-x86_64-musl.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "$VERSION" --generate-notes
