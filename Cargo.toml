[package]
name = "itdcall"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust NGS Internal Tandem Duplication (ITD) caller supporting hybrid capture and amplicon sequencing"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
memchr = "2.8"
noodles = { version = "0.120", features = ["bam", "sam", "fasta", "core", "csi"] }
rayon = "1.12"

[dev-dependencies]
tempfile = "3"
